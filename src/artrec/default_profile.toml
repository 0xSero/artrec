# ---------------------------------------------------------------------------
# Sources. Wikimedia endpoints are throttled hard and skipped if they rate-limit.
# ---------------------------------------------------------------------------
[visual]
# Share of the visual score from likeness to liked works, seeds and anchors; the rest comes from the prompts.
like_share = 0.6
# Optional hard subject gate (zero-shot CLIP): keep only images more likely to show `subject`
# than any of `subject_against`. Leave `subject` unset to switch it off. Example:
# subject = "a painting of a single woman"
# subject_against = ["a painting of a single man", "a painting of a group of people",
#                    "a landscape painting", "a still life"]
# subject_min = 0.45

[sources]
aic = true
cleveland = true
nga = true
commons = true
wikidata = true

