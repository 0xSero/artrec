# artrec taste profile.
# Edit freely: `artrec profile --edit` opens it. Feedback (`artrec like/dislike`) is stored separately
# in the database as learned adjustments on top of these numbers, so this file stays yours.

[era]
# Years outside this range are penalised smoothly, not excluded.
start = 1100
end = 1930

[weights]
# How the final score is blended (they are normalised, so only ratios matter).
meta = 0.40      # artist, era, subject keywords, object type
visual = 0.45    # CLIP similarity to works you liked + style prompts
quality = 0.10   # image resolution
novelty = 0.05   # prefer artists you have not been shown lately

[batch]
size = 6
max_per_artist = 1          # per batch
artist_cooldown_batches = 2 # an artist shown in the last N batches is penalised
min_long_side = 1600        # px; smaller images are skipped
min_color_share = 0.34      # at least this share of each batch is colour work (not monochrome prints)
min_aspect = 0              # width / height; e.g. 1.5 = only wide banner/wallpaper shapes (0 = any shape)

# ---------------------------------------------------------------------------
# Artists: weight 0..1. `aliases` are extra spellings matched against attributions.
