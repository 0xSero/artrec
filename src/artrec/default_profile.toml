# ---------------------------------------------------------------------------
# Visual taste anchors. Text prompts are embedded with CLIP and compared to every image.
# ---------------------------------------------------------------------------
[prompts]
positive = [
  "a dramatic visionary engraving of angels and demons",
  "a Gustave Doré wood engraving of a sublime biblical scene",
  "a William Blake watercolour of a mystical figure",
  "a medieval illuminated manuscript page with gold leaf",
  "an early Netherlandish altarpiece painting full of tiny detail",
  "a Hieronymus Bosch fantastical hellscape with strange creatures",
  "an Escher-like impossible architecture and geometric polyhedra",
  "a Renaissance woodcut of the apocalypse",
  "a romantic sublime apocalyptic landscape with tiny figures",
  "a symbolist painting of a dreamlike ethereal woman",
]
negative = [
  "a photograph",
  "a plain head and shoulders portrait of a man",
  "a still life with fruit",
  "a ceramic vase or decorative object",
  "a page of printed text",
  "a map",
  "a plain sketch of a hand",
  "a coin or medal",
  "a modern abstract painting",
]

