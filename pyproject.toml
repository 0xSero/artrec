[project]
name = "artrec"
version = "0.1.0"
description = "Personal recommender for public-domain classical art (medieval, Renaissance, visionary, engraving)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.0",
    "fastembed>=0.4",
]

[project.scripts]
artrec = "artrec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artrec"]
